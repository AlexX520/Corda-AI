# One-click hosted demo on Render (free plan): Dashboard → New → Blueprint → pick this repo.
# After the first deploy, add https://<your-service>.onrender.com/api/outlook/callback as a
# redirect URI on the Azure app (platform "Mobile and desktop applications").
services:
  - type: web
    name: corda-ai
    runtime: node
    plan: free
    region: virginia
    branch: v3
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: corda-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: ACCESS_CODE
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_TENANT
        value: common
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4.1-mini

databases:
  - name: corda-db
    plan: free
    region: virginia
    databaseName: conferenceos
    user: conference
