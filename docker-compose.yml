services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
      POSTGRES_DB: conferenceos
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - conferenceos_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conference -d conferenceos']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  conferenceos_data:
